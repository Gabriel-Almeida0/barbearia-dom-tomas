name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tipos
        # LayoutProps/PageProps são gerados pelo Next (next typegen)
        run: npx next typegen && npx tsc --noEmit
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build
